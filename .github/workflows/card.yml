name: Update MDL card
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i @resvg/resvg-js
      - run: node generate.mjs
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add card.png card.svg
          git diff --staged --quiet || git commit -m "update card"
          git push
